# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: AuroraWatch
options:
  bundleIdPrefix: com.brownie5596
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AuroraKit:
    path: Packages/AuroraKit
targets:
  AuroraWatch:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AuroraKit
        product: AuroraKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brownie5596.aurorawatch
        PRODUCT_NAME: AuroraWatch
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aurora Watch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.brownie5596.aurorawatch.refresh
        ITSAppUsesNonExemptEncryption: false
schemes:
  AuroraWatch:
    build:
      targets:
        AuroraWatch: all
    run:
      config: Debug
    archive:
      config: Release
