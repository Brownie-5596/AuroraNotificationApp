name: Aurora watcher (ntfy push)

# Optional: runs the app's alert engine every ~10 minutes and pushes alerts to the ntfy app.
# Enable by adding a repository secret named NTFY_TOPIC (see README). Scheduled runs only
# happen on the default branch.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts without sending them"
        type: boolean
        default: false

concurrency:
  group: aurora-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.1-noble
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$NTFY_TOPIC" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NTFY_TOPIC secret is not set — the watcher is idle. See README to enable push alerts."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'

      - name: Restore build cache
        if: steps.cfg.outputs.enabled == 'true'
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: Packages/AuroraKit/.build
          key: watcher-build-${{ hashFiles('Packages/AuroraKit/Package.swift', 'Packages/AuroraKit/Sources/**') }}

      - name: Build
        if: steps.cfg.outputs.enabled == 'true'
        run: swift build -c release --package-path Packages/AuroraKit --product aurora-watch

      - name: Save build cache
        if: steps.cfg.outputs.enabled == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Packages/AuroraKit/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Restore alert state
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: watcher-state
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Check space weather
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          Packages/AuroraKit/.build/release/aurora-watch \
            --state watcher-state/state.json \
            --settings Watcher/settings.json \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Save alert state
        if: always() && steps.cfg.outputs.enabled == 'true' && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: watcher-state
          key: watcher-state-${{ github.run_id }}
